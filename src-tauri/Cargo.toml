[package]
name = "commanddeck"
version = "0.1.0"
edition = "2021"
description = "A local desktop workspace for organizing and running command-line tools."
repository = "https://github.com/PipeManGoGoGo/CommandDeck"
homepage = "https://github.com/PipeManGoGoGo/CommandDeck"
publish = false

[lib]
name = "commanddeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
