name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  validate-version:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify tag and application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.RELEASE_TAG ?? '';
          if (!/^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag has an unsupported format: ${tag}`);
          }
          const expected = tag.slice(1);

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');

          const packageSection = cargoToml.match(/^\[package\]\n([\s\S]*?)(?=\n\[|$)/)?.[1];
          const cargoManifestVersion = packageSection?.match(/^version\s*=\s*"([^"]+)"$/m)?.[1];
          const commandDeckPackage = cargoLock
            .split('[[package]]')
            .find((block) => /^name = "commanddeck"$/m.test(block));
          const cargoLockVersion = commandDeckPackage?.match(/^version = "([^"]+)"$/m)?.[1];

          const versions = {
            'package.json': packageJson.version,
            'package-lock.json': packageLock.version,
            'package-lock.json root package': packageLock.packages?.['']?.version,
            'src-tauri/tauri.conf.json': tauriConfig.version,
            'src-tauri/Cargo.toml': cargoManifestVersion,
            'src-tauri/Cargo.lock commanddeck package': cargoLockVersion,
          };

          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            const details = Object.entries(versions)
              .map(([source, version]) => `${source}: ${version ?? '<missing>'}`)
              .join('\n');
            throw new Error(`Tag ${tag} does not match every application version:\n${details}`);
          }
          console.log(`Validated ${tag} across every application version source.`);
          NODE

  build:
    needs: [quality, validate-version]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Collect platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: commanddeck-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: commanddeck-*
          path: release-assets
          merge-multiple: true

      - name: Validate release asset coverage
        shell: bash
        run: |
          set -euo pipefail

          count_assets() {
            find release-assets -type f -name "$1" -print | wc -l | tr -d ' '
          }

          require_assets() {
            local pattern="$1"
            local minimum="$2"
            local label="$3"
            local count
            count="$(count_assets "$pattern")"
            if (( count < minimum )); then
              echo "Expected at least ${minimum} ${label} asset(s), found ${count}." >&2
              exit 1
            fi
          }

          require_assets '*.dmg' 2 'DMG'
          require_assets '*.msi' 1 'MSI'
          require_assets '*.exe' 1 'EXE'
          require_assets '*.AppImage' 1 'AppImage'
          require_assets '*.deb' 1 'DEB'
          require_assets '*.rpm' 1 'RPM'

          find release-assets -type f -print | sort

      - name: Create draft pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.dmg' -o \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' \
            \) -print0
          )
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --draft \
            --prerelease \
            --title "CommandDeck ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
